<style>
:root{--txt:#eef2fb;--mut:#98a5c0;--acc:#22d37a;--gold:#ffcf4a;--red:#ff5c6c;--blue:#4aa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--txt);font:14px system-ui,sans-serif;background:#0b0f17;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 20s infinite alternate}
body:before{background:#7c5cff;left:-20vmax;top:-20vmax}body:after{background:#22d37a;right:-25vmax;bottom:-25vmax;animation-delay:-8s}
@keyframes fl{to{transform:translate(8vmax,6vmax)}}
.gl{background:rgba(255,255,255,.07);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.14);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 30px rgba(0,0,0,.35)}
#app{max-width:980px;margin:0 auto;padding:10px 10px 90px}
.hd{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:10px}.hd b{flex:1}
h2,h3,h4{margin:6px 0}.card{padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}.mut{color:var(--mut)}
.b{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--txt);padding:9px 14px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;backdrop-filter:blur(10px)}
.b:hover{background:rgba(255,255,255,.2)}.b.p{background:linear-gradient(135deg,#22d37a,#10a35a);border:0;color:#04140b}.b.on{outline:2px solid var(--acc)}.b.s{padding:5px 9px;font-size:12px}.b[disabled]{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}

.pitch svg{position:absolute;inset:0;width:100%;height:100%}.pitch svg *{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.35}
.sl{position:absolute;transform:translate(-50%,-50%);text-align:center;touch-action:none;cursor:grab;width:64px;user-select:none;z-index:2}
.sl i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:auto;border-radius:50%;font:700 12px system-ui;font-style:normal;border:2px solid #fff;box-shadow:0 2px 8px #0008;color:#fff}
.sl u{display:block;text-decoration:none;font-size:10px;font-weight:600;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.LG i{background:#c9a400}.LD i{background:#2f6fe0}.LM i{background:#1aa06a}.LA i{background:#d6414f}.sl.sel i{outline:3px solid var(--gold);transform:scale(1.15)}.sl.bad i{opacity:.45;border-color:var(--red)}
.pc{position:relative;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;margin:5px 0;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.pc b.g{font-size:22px;width:38px;text-align:center}.pc small{color:var(--mut)}
.pc.t4{background:linear-gradient(135deg,#2a1f55,#6a3df0 40%,#16c7ff 70%,#b8ff6a);}.pc.t3{background:linear-gradient(135deg,#5b4400,#d4a017,#fff0a0 60%,#d4a017)}.pc.t3 *{color:#1a1200!important}
.pc.t2{background:linear-gradient(135deg,#444c5c,#aab3c4,#eef2f8 60%,#9aa3b5)}.pc.t2 *{color:#10151f!important}.pc.t1{background:linear-gradient(135deg,#4a2b14,#a8683a,#e2a574)}
.pc.t4:after,.pc.t3:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-120%);animation:sh 3.2s infinite}
@keyframes sh{to{transform:translateX(120%)}}.pc.sel{outline:3px solid var(--gold)}.pc .tag{font-size:10px;padding:1px 6px;border-radius:8px;background:#0006;color:#fff!important}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}tr.me{background:rgba(34,211,122,.18)}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tg h4{width:100%}.ck{padding:6px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font-size:12px;cursor:pointer}.ck.on{background:var(--acc);color:#04140b;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:center;z-index:5;background:rgba(10,14,22,.7);backdrop-filter:blur(16px)}
#md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}#md.on{display:flex}#md>div{max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:16px;background:rgba(24,30,46,.92)}
input,select{background:#0006;border:1px solid #fff3;color:#fff;border-radius:10px;padding:9px;font:inherit}
.hud{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;font-size:20px;font-weight:800}.hud small{font-size:12px;font-weight:500;color:var(--mut)}
#cv{width:100%;display:block;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:#1c7a3f}
#goal{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;background:radial-gradient(circle,#22d37acc,#000c);animation:gi .4s}
#goal.on{display:flex}#goal .gb{font-size:min(22vw,120px);font-weight:900;letter-spacing:4px;animation:pop .9s infinite alternate;text-shadow:0 0 40px #fff}
@keyframes gi{from{opacity:0}}@keyframes pop{from{transform:scale(.85) rotate(-3deg)}to{transform:scale(1.1) rotate(3deg)}}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:8px 14px;z-index:40;display:none}
.bar{height:8px;border-radius:5px;background:#fff2;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
</style></head><body>

function strength(tm){const av=l=>{const a=tm.pl.filter(p=>p.line==l);return a.length?a.reduce((s,p)=>s+p.r,0)/a.length:50};return{a:av('A'),m:av('M'),d:av('D'),g:av('G')}}
function pois(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function simQ(a,b){const A=strength(a),B=strength(b),at=(s,t)=>(2*s.a+s.m)/3+t.att*.5,df=(s,t)=>(2*s.d+s.g+s.m)/4+t.def*.5;

 if(tb=='home'){const m=e&&mine(e),o=m&&m.find(x=>x!=S.club),obj={f:12,n:8,d:4}[S.diff];const rk=table().findIndex(x=>x[0]==S.club)+1;
  h+=`<div class="gl card"><h3>Prochain match</h3>${e?`<div class="mut">${evName(e)}</div>`:''}${o?`<div class="row"><h2>${lg(S.club,40)} vs ${lg(o,40)} ${o}</h2></div>`:'<div class="mut">Votre club n\'est pas concerné.</div>'}<br><button class="b p" onclick="play()">${o?'Préparer le match':'Simuler'}</button></div>
  <div class="gl card"><b>Objectif du board :</b> terminer dans les ${obj} premiers (actuel : ${rk}e)<br><b>Offres reçues :</b> ${S.inbox.length}${S.last?`<br><b>Dernier match :</b> ${S.last}`:''}</div>`+tbl(6)}
 else if(tb=='squad')h+=squad();else if(tb=='table')h+=tbl(20)+cups();else h+=market();
 $('#app').innerHTML=h+`<div class="tabs gl">${[['home','🏠 Accueil'],['squad','👕 Effectif'],['table','🏆 Classement'],['mkt','💶 Transferts']].map(x=>`<button class="b s ${tb==x[0]?'on':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
 if(tb=='squad')drawSquad()}
const tbl=n=>`<div class="gl card"><table><tr><th>#</th><th>Club</th><th>J</th><th>V</th><th>N</th><th>D</th><th>Diff</th><th>Pts</th></tr>${table().slice(0,n).map((x,i)=>`<tr class="${x[0]==S.club?'me':''}"><td>${i+1}</td><td>${lg(x[0],20)} ${x[0]}</td><td>${x[1].pl}</td><td>${x[1].w}</td><td>${x[1].d}</td><td>${x[1].l}</td><td>${x[1].gf-x[1].ga}</td><td><b>${x[1].pts}</b></td></tr>`).join('')}</table></div>`;
const cups=()=>`<div class="gl card">${['FA','LC'].map(k=>{const c=S.cup[k];return `<b>${k=='FA'?'FA Cup':'Carabao Cup'}</b> : ${c.won?'Vainqueur : '+c.won:c.al.includes(S.club)?'Toujours en lice':'Éliminé'}<br>`}).join('')}</div>`;
function squad(){return `<div class="gl card"><b>Terrain libre</b> <span class="mut">Glissez pour repositionner · touchez deux joueurs pour les échanger (banc compris)</span><div id="pt" style="margin:8px 0"></div><div id="bn"></div></div>${tacUI()}<div class="gl card"><h4>Joueurs (touchez « Vendre » pour recevoir des offres)</h4>${[...T().xi,...T().bench].filter(x=>x!=null).map(i=>`<div class="row">${pc(P[i],'','').replace('class="pc','style="flex:1" class="pc')}<button class="b s" onclick="listSale(${i})">Vendre</button></div>`).join('')}</div>`}
function drawSquad(){const t=T();const swap=(a,b)=>{const g=k=>k<11?t.xi[k]:t.bench[k-11],s=(k,v)=>{k<11?t.xi[k]=v:(v==null?t.bench.splice(k-11,1):t.bench[k-11]=v)};const x=g(a),y=g(b);if(a>=11&&b>=11&&0)return;s(a,y);s(b,x);t.bench=t.bench.filter(v=>v!=null)};
 const tap=k=>{if(UI.s1==null)UI.s1=k;else{if(UI.s1!=k)swap(UI.s1,k);UI.s1=null}drawSquad()};window.sqTap=tap;
 pitch($('#pt'),t.sl,{drag:1,top:i=>t.xi[i]!=null?P[t.xi[i]].g:'+',bot:i=>t.xi[i]!=null?P[t.xi[i]].name.split(' ').pop():'',cls:i=>(UI.s1==i?'sel ':'')+(t.xi[i]!=null&&(P[t.xi[i]].inj>0||P[t.xi[i]].sus>0)?'bad':''),tap,end:drawSquad});
 $('#bn').innerHTML='Banc : '+[0,1,2,3].map(i=>{const p=P[t.bench[i]];return `<span class="ck ${UI.s1==11+i?'on':''}" onclick="sqTap(${11+i})">${p?p.name+' '+p.g:'vide'}</span>`}).join('')}
// ---- transferts
function market(){const f=UI.flt,fr=P.filter(p=>p.team!=S.club&&(f=='*'||p.pos==f)&&(!UI.q||p.name.toLowerCase().includes(UI.q))).sort((a,b)=>val(b)-val(a)).slice(0,30);
 return `<div class="gl card"><h3>Offres reçues (${S.inbox.length})</h3>${S.inbox.map(o=>`<div class="row">${pc(P[o.pid]).replace('class="pc','style="flex:1" class="pc')}<div>${lg(o.club,22)} ${o.club}<br><b>${Mo(o.amt)}</b><br><button class="b s p" onclick="resp(${o.id},1)">Accepter</button> <button class="b s" onclick="resp(${o.id},0)">Refuser</button> <button class="b s" onclick="counter(${o.id})">Négocier</button></div></div>`).join('')||'<span class="mut">Aucune offre.</span>'}</div>
 <div class="gl card"><h3>Marché</h3><div class="row">${[['*','Tous'],['G','GK'],['D','DEF'],['M','MIL'],['A','ATT']].map(x=>`<button class="b s ${f==x[0]?'on':''}" onclick="UI.flt='${x[0]}';hub()">${x[1]}</button>`).join('')}<input placeholder="Rechercher" value="${UI.q}" oninput="UI.q=this.value.toLowerCase();clearTimeout(UI.tm);UI.tm=setTimeout(hub,400)" style="flex:1;min-width:100px"></div>${fr.map(p=>pcx(p,`onclick="nego(${p.id})"`)).join('')}</div>`}
const rep=c=>{const s=strength(side(c));return(s.a+s.m+s.d)/3};
function nego(id){const p=P[id];const imp=p.team!=null&&T(p.team).xi.includes(id)?.2:0,rp=p.team!=null&&rep(p.team)>74?.08:0;N={id,ask:Math.round(val(p)*(p.team==null?.6:1+imp+rp)*(.95+R()*.1)*2)/2,tries:3,msg:''};nUI()}
function nUI(){const p=P[N.id],c=p.team;modal(`<h3>Négociation</h3>${pc(p)}<p>${c?lg(c,24)+' '+c+' demande':'Agent libre — demande'} <b>${Mo(N.ask)}</b><br><span class="mut">Budget : ${Mo(S.money)} · patience : ${N.tries}</span></p><p>${N.msg}</p><div class="row"><input id="of" type="number" step="0.5" value="${Math.round(N.ask*.85*2)/2}" style="width:110px"> M€<button class="b p" onclick="offer()">Proposer</button><button class="b" onclick="close()">Abandonner</button></div>`)}
function offer(){const o=+$('#of').value,p=P[N.id],r=o/N.ask;if(!(o>0))return;if(o>S.money){N.msg='❌ Budget insuffisant.';return nUI()}
 if(r>=1||(r>=.97&&R()<.5))return buy(p,o);
 if(r>=.8){N.ask=Math.max(o,Math.round(N.ask*(.93+R()*.04)*2)/2);N.msg=`↪ Contre-offre : ${Mo(N.ask)}`;N.tries--}else{N.tries--;N.msg='😠 Offre insultante, refusée.'}
 if(N.tries<=0){close();return toast('Négociations rompues')}nUI()}
function rm(c,id){const t=T(c);const i=t.xi.indexOf(id);if(i>=0)t.xi[i]=null;t.bench=t.bench.filter(x=>x!=id)}
function buy(p,o){const old=p.team;S.money-=o;if(old!=null){rm(old,p.id)}const t=T();if(t.bench.length>=4){const w=t.bench.map(i=>P[i]).sort((a,b)=>a.g-b.g)[0];t.bench=t.bench.filter(i=>i!=w.id);w.team=null}t.bench.push(p.id);p.team=S.club;if(old!=null)while(aiPick(old));close();toast(`${p.name} signé pour ${Mo(o)} (sur le banc)`);save();hub()}
function mkOffer(pid,club){const p=P[pid];S.inbox.push({id:Date.now()+ri(0,999),pid,club,amt:Math.round(val(p)*(.85+R()*.4)*2)/2,tries:2});S.inbox=S.inbox.slice(-5)}
function listSale(id){mkOffer(id,shuf(CL.filter(c=>c!=S.club))[0]);toast('Un club a fait une offre (onglet Transferts)')}
function resp(id,ok){const o=S.inbox.find(x=>x.id==id);S.inbox=S.inbox.filter(x=>x.id!=id);if(ok){const p=P[o.pid];rm(S.club,p.id);p.team=o.club;const t=T(o.club);if(t.bench.length>=4){const w=t.bench.map(i=>P[i]).sort((a,b)=>a.g-b.g)[0];t.bench=t.bench.filter(i=>i!=w.id);w.team=null}t.bench.push(p.id);S.money+=o.amt;toast(`${p.name} vendu ${Mo(o.amt)}`)}save();hub()}
function counter(id){const o=S.inbox.find(x=>x.id==id);modal(`<h3>Contre-proposition</h3>${pc(P[o.pid])}<p>${o.club} offre ${Mo(o.amt)}</p><div class="row"><input id="of" type="number" step="0.5" value="${Math.round(o.amt*1.2*2)/2}" style="width:110px"> M€<button class="b p" onclick="cdo(${id})">Envoyer</button><button class="b" onclick="close()">Annuler</button></div>`)}
function cdo(id){const o=S.inbox.find(x=>x.id==id),a=+$('#of').value;close();if(a<=o.amt*1.15){o.amt=a;return resp(id,1)}if(a<=o.amt*1.4&&o.tries-->0){o.amt=Math.round((o.amt+a)/2*2)/2;toast(`${o.club} remonte à ${Mo(o.amt)}`)}else{S.inbox=S.inbox.filter(x=>x.id!=id);toast(o.club+' retire son offre')}save();hub()}
// ---- match
function play(){const e=S.ev[S.evi],m=mine(e);if(!m){resolve(e,null);return endEv('Journée simulée')}
 const o=m.find(x=>x!=S.club),a=side(S.club),b=side(o),sa=strength(a),sb=strength(b),top=[...T(o).xi,...T(o).bench].map(i=>P[i]).filter(Boolean).sort((x,y)=>y.g-x.g).slice(0,3),sty=TI.filter((x,i)=>T(o).tac[i]).slice(0,3).map(x=>x[0]).join(', ')||'Équilibré',miss=T().xi.filter(i=>i!=null&&(P[i].inj>0||P[i].sus>0)).length;
 const bar=(l,x,y)=>`<div>${l} ${Math.round(x)} vs ${Math.round(y)}<div class="bar"><i style="width:${cl(x/(x+y)*100,5,95)}%"></i></div></div>`;
 $('#app').innerHTML=hdr()+`<div class="gl card"><h3>🔍 Scouting — ${lg(o,30)} ${o}</h3><div class="mut">${evName(e)}</div><p>Style : ${sty}<br>Forme : ${top.map(p=>p.name.split(' ').pop()+' '+(p.form>=0?'+':'')+p.form.toFixed(1)).join(' · ')}</p>${bar('Attaque',sa.a,sb.d)}${bar('Milieu',sa.m,sb.m)}${bar('Défense',sa.d,sb.a)}<p>Joueurs à surveiller : ${top.map(p=>p.name+' ('+p.g+')').join(', ')}${miss?`<br>⚠️ ${miss} titulaire(s) indisponible(s) — remplaçant ou jeune de l'académie (60).`:''}</p><div class="row"><button class="b" onclick="hub()">← Retour</button><button class="b p" onclick="kickoff('${o}')">Coup d'envoi ▶</button></div></div>`}
function kickoff(o){const e=S.ev[S.evi],a=side(S.club),b=side(o);MM={m:mkM(a,b),sp:1,acc:0,last:0,o,e,subs:0,pause:0,fin:0,stop:0};const m=MM.m;
 m.onGoal=g=>{m.wait=1;const c=g.team?o:S.club;$('#goal').innerHTML=`<div class="gb">BUT !</div>${lg(c,110)}<h2>${g.name} ${g.min}'</h2><h3>${S.club} ${m.score[0]} - ${m.score[1]} ${o}</h3>`;$('#goal').classList.add('on');setTimeout(()=>{$('#goal').classList.remove('on');m.wait=0},2300)};
 m.onCard=c=>toast(`${c.type=='y'?'🟨':'🟥'} ${c.name} (${c.min}')`);
 $('#app').innerHTML=`<div class="gl hud"><span>${lg(S.club,30)} <span id="sa">0</span></span><small id="ck">0'</small><span><span id="sb">0</span> ${lg(o,30)}</span></div><canvas id="cv" width="1050" height="680"></canvas><div class="row" style="margin-top:8px;justify-content:center">${[1,2,4,8].map(v=>`<button class="b s" onclick="MM.sp=${v}">×${v}</button>`).join('')}<button class="b s" onclick="MM.pause=!MM.pause">⏯</button><button class="b s p" onclick="subUI()">Remplacements / Tactique</button></div><div class="mut" id="st" style="text-align:center;margin-top:6px"></div>`;requestAnimationFrame(loop)}
function loop(ts){if(!MM||MM.stop)return;const m=MM.m,dt=Math.min(.05,((ts-MM.last)||16)/1000);MM.last=ts;if(!MM.pause&&!m.wait&&!$('#md').classList.contains('on')){MM.acc+=dt*MM.sp*2.5/.2;let n=Math.min(40,Math.floor(MM.acc));MM.acc-=n;while(n--&&!m.done)step(m,.2)}draw();
 $('#sa').textContent=m.score[0];$('#sb').textContent=m.score[1];$('#ck').textContent=mn(m)+"'";const pp=Math.round(m.poss[0]/(m.poss[0]+m.poss[1])*100);$('#st').textContent=`Tirs ${m.shots[0]}-${m.shots[1]} · Cadrés ${m.sot[0]}-${m.sot[1]} · Possession ${pp}%-${100-pp}%`;
 if(m.done&&!MM.fin){MM.fin=1;setTimeout(endMatch,800)}requestAnimationFrame(loop)}
function draw(){const c=$('#cv');if(!c)return;const x=c.getContext('2d'),m=MM.m,k=10;x.clearRect(0,0,1050,680);for(let i=0;i<10;i++){x.fillStyle=i%2?'#1f8a47':'#1c7a3f';x.fillRect(i*105,0,105,680)}
 x.strokeStyle='#ffffffaa';x.lineWidth=3;x.strokeRect(5,5,1040,670);x.beginPath();x.moveTo(525,5);x.lineTo(525,675);x.stroke();x.beginPath();x.arc(525,340,91,0,7);x.stroke();x.strokeRect(5,138,165,404);x.strokeRect(880,138,165,404);
 for(const p of m.pl){if(p.out)continue;x.beginPath();x.arc(p.x*k,p.y*k,15,0,7);x.fillStyle=p.line=='G'?'#ffd84a':p.team?'#ff5c6c':'#3d8bff';x.fill();x.lineWidth=m.ball.own===p?5:2;x.strokeStyle=m.ball.own===p?'#fff':'#0008';x.stroke();x.fillStyle='#fff';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(p.n||'',p.x*k,p.y*k+4.5)}
 x.beginPath();x.arc(m.ball.x*k,m.ball.y*k,8,0,7);x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=6;x.fill();x.shadowBlur=0}
function subUI(){if(!MM)return;const m=MM.m,t=T(),on=m.pl.filter(p=>p.team==0&&!p.out),bn=t.bench.map(i=>P[i]).filter(p=>p.inj<=0&&p.sus<=0&&!m.pl.some(q=>q.pid==p.id));
 modal(`<h3>Gestion du match</h3><div class="row">${[[-2,'Défensive'],[0,'Équilibrée'],[2,'Offensive']].map(x=>`<button class="b s ${t.ment==x[0]?'on':''}" onclick="ment(${x[0]})">${x[1]}</button>`).join('')}</div><h4>Remplacements (${MM.subs}/5) : touchez un joueur sur le terrain puis un remplaçant</h4>${on.map(p=>pc({name:p.name,g:Math.round(p.r),p:'-',pos:p.line,c0:S.club,form:0,inj:0,sus:0},`onclick="UI.s1=${p.slot};subUI()"`,UI.s1==p.slot?'sel':'')).join('')}<h4>Banc</h4>${bn.map(p=>pcx(p,`onclick="doSub(${p.id})"`)).join('')||'<span class="mut">Banc vide</span>'}<div class="row" style="margin-top:8px"><button class="b p" onclick="close()">Reprendre</button></div>`)}
function doSub(id){if(UI.s1==null)return toast('Choisissez d\'abord le joueur à sortir');if(MM.subs>=5)return toast('5 changements max');const m=MM.m,t=T(),q=m.pl.find(p=>p.team==0&&p.slot==UI.s1&&!p.out),p=P[id];q.r=eff(p,q.line);q.name=p.name;q.n=p.n;const old=q.pid;q.pid=p.id;q.yc=0;
 if(old>=0){const xi=t.xi.indexOf(old);if(xi>=0)t.xi[xi]=id;t.bench=t.bench.filter(i=>i!=id);if(!P[old].inj&&!P[old].sus)t.bench.push(old)}MM.subs++;UI.s1=null;subUI()}
function pen(a,b){const sa=strength(side(a)),sb=strength(side(b));return R()<.5+((sa.a+sa.g)-(sb.a+sb.g))/300?a:b}
function setRes(a,b,ga,gb){const x=S.tbl[a],y=S.tbl[b];x.pl++;y.pl++;x.gf+=ga;x.ga+=gb;y.gf+=gb;y.ga+=ga;if(ga>gb){x.w++;y.l++;x.pts+=3}else if(ga<gb){y.w++;x.l++;y.pts+=3}else{x.d++;y.d++;x.pts++;y.pts++}}
function resolve(e,mr){const ps=pairs(e);if(e.k=='L'){ps.forEach(([h,a])=>{if(mr&&(h==S.club||a==S.club))setRes(h,a,h==S.club?mr[0]:mr[1],h==S.club?mr[1]:mr[0]);else{const r=simQ(side(h),side(a));setRes(h,a,r[0],r[1])}})}
 else{const c=S.cup[e.k],w=[];ps.forEach(p=>{if(mr&&p.includes(S.club)){const o=p.find(x=>x!=S.club);w.push(mr[0]>mr[1]?S.club:mr[0]<mr[1]?o:pen(S.club,o))}else{const r=simQ(side(p[0]),side(p[1]));w.push(r[0]>r[1]?p[0]:r[0]<r[1]?p[1]:pen(p[0],p[1]))}});c.al=w;c.pr=null;if(e.rd==3){c.won=w[0];if(w[0]==S.club){S.money+=10}}}}
function endMatch(){MM.stop=1;const m=MM.m,o=MM.o,e=MM.e,g=m.score;let note='';if(e.k!='L'&&g[0]==g[1]){const w=pen(S.club,o);note=` (tab : ${w==S.club?'victoire':'défaite'})`}
 resolve(e,g);const t=T(),win=g[0]>g[1]?1:g[0]<g[1]?-1:0,inj=[];
 [...t.xi,...t.bench].forEach(i=>{const p=i!=null&&P[i];if(!p)return;if(p.inj>0)p.inj--;if(p.sus>0)p.sus--});
 m.pl.filter(p=>p.team==0&&p.pid>=0).forEach(q=>{const p=P[q.pid];p.form=cl(p.form+win*.7+q.g*.8+(R()-.5),-3,3);if(R()<.035){p.inj=ri(1,6);inj.push(`${p.name} (${p.inj} j.)`)}});
 m.cards.filter(c=>c.team==0&&c.pid>=0).forEach(c=>{const p=P[c.pid];if(c.type=='r'){p.sus+=1+ri(0,2)}else if(++p.yc>=5){p.yc=0;p.sus+=1}});
 [...t.xi,...t.bench].forEach(i=>{if(i!=null&&P[i])P[i].form*=.85});S.money+=1.5+(win>0?1:0);
 S.last=`${S.club} ${g[0]}-${g[1]} ${o}${note}`;
 modal(`<h2>${win>0?'Victoire !':win<0?'Défaite':'Match nul'}</h2><h1>${lg(S.club,36)} ${g[0]} - ${g[1]} ${lg(o,36)}${note}</h1><p>${m.ev.map(x=>`⚽ ${x.name} ${x.min}'`).join('<br>')||'Aucun but'}</p><p>${m.cards.map(c=>`${c.type=='y'?'🟨':'🟥'} ${c.name} ${c.min}'`).join('<br>')}</p>${inj.length?`<p>🩹 Blessés : ${inj.join(', ')}</p>`:''}<button class="b p" onclick="endEv()">Continuer</button>`)}
function endEv(msg){close();MM=null;S.evi++;if(R()<.3){const t=T(),ids=[...t.xi,...t.bench].filter(x=>x!=null);if(ids.length)mkOffer(ids[ri(0,ids.length-1)],shuf(CL.filter(c=>c!=S.club))[0])}
 if(S.evi>=S.ev.length)return seasonEnd();save();if(msg)toast(msg);UI.tab='home';hub()}
function seasonEnd(){const rk=table().findIndex(x=>x[0]==S.club)+1,obj={f:12,n:8,d:4}[S.diff],ok=rk<=obj,champ=table()[0][0];S.money+=(21-rk)*1.5;
 P.forEach(p=>{p.form=0;p.yc=0;if(p.g<p.p)p.g+=ri(0,Math.ceil((p.p-p.g)/3));else if(p.g>82&&R()<.25)p.g--;p.p=Math.max(p.p,p.g)});
 modal(`<h2>Fin de saison ${S.sea}</h2><p>Champion : <b>${champ}</b><br>Votre classement : <b>${rk}e</b> (objectif : top ${obj})</p><p>${ok?'✅ Le board est satisfait !':S.diff=='d'?'⚠️ Le board est furieux, votre poste est menacé…':'❌ Objectif manqué, le board est déçu.'}</p><p class="mut">Les joueurs ont progressé vers leur potentiel. Revenus : +${Mo((21-rk)*1.5)}</p><button class="b p" onclick="close();S.sea++;buildCal();save();UI.tab='home';hub()">Saison suivante</button>`)}
init();
</script></body></html>
